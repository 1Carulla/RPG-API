{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taverna Éther Neth - RPG de Mesa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'personagens/estilo.css' %}">
</head>
<body data-mestre="{{ mestre|yesno:'1,0' }}">
  <header class="placa">
    <div class="marca">
      <span class="brasao" aria-hidden="true">⚔</span>
      <div>
        <h1>Taverna Éther Neth</h1>
        <p class="subtitulo">Livro de registros dos aventureiros</p>
      </div>
    </div>
    <div class="acesso">
      {% if mestre %}
        <span class="selo selo-mestre">👑 Mestre: {{ request.user.username }}</span>
        <form method="post" action="/admin/logout/">
          {% csrf_token %}
          <input type="hidden" name="next" value="/">
          <button type="submit" class="btn btn-fantasma">Sair</button>
        </form>
      {% else %}
        <span class="selo">🎲 Acesso de jogador</span>
        <a class="btn btn-fantasma" href="/admin/login/?next=/">Entrar como mestre</a>
      {% endif %}
    </div>
  </header>

  <main>
    <section class="pergaminho">
      <h2>Campanhas</h2>
      <nav id="abas" class="abas" aria-label="Filtrar por campanha"></nav>
      <p id="info-campanha" class="info-campanha"></p>
      <form id="form-campanha" class="linha-form">
        <input type="text" id="campanha-nome" placeholder="Nome da nova campanha">
        <input type="text" id="campanha-descricao" placeholder="Descrição (opcional)">
        <button type="submit" class="btn">Criar campanha</button>
      </form>
      <p id="mensagem-campanha" class="mensagem"></p>
    </section>

    <section class="pergaminho">
      <h2>Recrutar aventureiro</h2>
      <form id="formulario" class="grade-form">
        <label>Nome <input type="text" id="nome" placeholder="Ex.: Elara Luzprata"></label>
        <label>Classe <input type="text" id="classe" placeholder="Mago, Guerreiro..."></label>
        <label>Nível <input type="number" id="nivel" min="1" step="1" placeholder="Ex.: 1"></label>
        <label>PV máximos <input type="number" id="pontos_vida_max" min="1" step="1" placeholder="Ex.: 12"></label>
        <label>Campanha <select id="campanha"></select></label>
        <button type="submit" class="btn btn-ouro">Recrutar</button>
      </form>
      <p id="mensagem" class="mensagem"></p>
    </section>

    <section>
      <div class="barra-grupo">
        <h2 class="titulo-claro">Grupo de aventureiros <span id="contagem" class="contagem"></span></h2>
        <div class="controles-combate">
          <button type="button" id="botao-combate" class="btn">⚔ Ordenar por iniciativa</button>
          <button type="button" id="botao-encerrar" class="btn btn-fantasma-claro">Encerrar combate</button>
        </div>
      </div>
      <p id="dica-combate" class="dica"></p>
      <div id="lista" class="grade-fichas"></div>
    </section>
  </main>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script src="{% static 'personagens/app.js' %}"></script>
</body>
</html>
