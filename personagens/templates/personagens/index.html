<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ficha de Personagens - RPG de Mesa</title>
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 760px;
      margin: 30px auto;
      padding: 0 12px;
      background: #f4ecd8;
      color: #2b1d0e;
    }
    h1 { color: #5c1a1a; }
    input { padding: 6px; margin: 4px 0; }
    li { margin: 10px 0; }
    button { margin-left: 6px; cursor: pointer; }
    .morto { color: gray; text-decoration: line-through; }
    #mensagem { color: darkred; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Ficha de Personagens</h1>

  <h2>Novo personagem</h2>
  <form id="formulario">
    <input type="text" id="nome" placeholder="Nome">
    <input type="text" id="classe" placeholder="Classe (Mago, Guerreiro...)">
    <input type="number" id="nivel" placeholder="Nível">
    <input type="number" id="pontos_vida" placeholder="Pontos de vida">
    <button type="submit">Cadastrar</button>
  </form>
  <p id="mensagem"></p>

  <h2>Grupo de aventureiros</h2>
  <ul id="lista"></ul>

  <script>
    const API = "/api/personagens/";
    const lista = document.getElementById("lista");
    const formulario = document.getElementById("formulario");
    const mensagem = document.getElementById("mensagem");

    async function carregarPersonagens() {
      const resposta = await fetch(API);
      const dados = await resposta.json();

      lista.innerHTML = "";
      for (const p of dados.personagens) {
        const item = document.createElement("li");
        item.textContent = p.nome + " - " + p.classe + " (nível " + p.nivel
          + ", " + p.pontos_vida + " PV)";
        if (!p.vivo) {
          item.textContent += " [caído]";
          item.className = "morto";
        }

        const botaoVida = document.createElement("button");
        botaoVida.textContent = p.vivo ? "Derrotar" : "Reviver";
        botaoVida.onclick = () => alterar(p.id, { vivo: !p.vivo });

        const botaoNivel = document.createElement("button");
        botaoNivel.textContent = "Subir de nível";
        botaoNivel.onclick = () => alterar(p.id, { nivel: p.nivel + 1 });

        const botaoExcluir = document.createElement("button");
        botaoExcluir.textContent = "Excluir";
        botaoExcluir.onclick = () => excluirPersonagem(p.id);

        item.append(botaoVida, botaoNivel, botaoExcluir);
        lista.appendChild(item);
      }
    }

    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      // Campos de número vazios viram null, para a API responder com o erro
      const nivel = document.getElementById("nivel").value;
      const pv = document.getElementById("pontos_vida").value;
      const novo = {
        nome: document.getElementById("nome").value,
        classe: document.getElementById("classe").value,
        nivel: nivel === "" ? null : Number(nivel),
        pontos_vida: pv === "" ? null : Number(pv),
      };

      const resposta = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(novo),
      });

      if (resposta.status === 201) {
        mensagem.textContent = "";
        formulario.reset();
        carregarPersonagens();
      } else {
        const dados = await resposta.json();
        mensagem.textContent = dados.erro;
      }
    });

    async function alterar(id, campos) {
      await fetch(API + id + "/", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(campos),
      });
      carregarPersonagens();
    }

    async function excluirPersonagem(id) {
      if (!confirm("Excluir este personagem?")) {
        return;
      }
      await fetch(API + id + "/", { method: "DELETE" });
      carregarPersonagens();
    }

    carregarPersonagens();
  </script>
</body>
</html>
